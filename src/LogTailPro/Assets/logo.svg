<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E3A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#12122A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#29B6F6;stop-opacity:0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="248" height="248" rx="38" ry="38" fill="url(#bgGrad)"/>

  <!-- Subtle inner border shine -->
  <rect x="4" y="4" width="248" height="248" rx="38" ry="38"
        fill="none" stroke="#3A3A5A" stroke-width="1.5" opacity="0.6"/>

  <!-- Log line 1 — full width with prompt chevron -->
  <text x="28" y="88" font-family="Consolas,monospace" font-size="18" fill="#4FC3F7" opacity="0.5">&gt;</text>
  <rect x="52" y="72" width="168" height="20" rx="3" fill="url(#lineGrad)" filter="url(#glow)"/>

  <!-- Log line 2 — medium width -->
  <text x="28" y="124" font-family="Consolas,monospace" font-size="18" fill="#4FC3F7" opacity="0.5">&gt;</text>
  <rect x="52" y="108" width="116" height="20" rx="3" fill="url(#lineGrad)" opacity="0.78"/>

  <!-- Log line 3 — short width -->
  <text x="28" y="160" font-family="Consolas,monospace" font-size="18" fill="#4FC3F7" opacity="0.5">&gt;</text>
  <rect x="52" y="144" width="78" height="20" rx="3" fill="url(#lineGrad)" opacity="0.58"/>

  <!-- Divider line -->
  <line x1="28" y1="178" x2="228" y2="178" stroke="#3A3A5A" stroke-width="1" opacity="0.7"/>

  <!-- Tail arrow — amber downward chevron (represents follow/tail) -->
  <polygon points="128,222 92,188 164,188" fill="#FFB74D" filter="url(#glow)" opacity="0.95"/>
  <polygon points="128,210 100,186 156,186" fill="none" stroke="#FFA726" stroke-width="1.5" opacity="0.5"/>

  <!-- Small "tail" label text -->
  <text x="128" y="238" font-family="Segoe UI,sans-serif" font-size="11"
        fill="#FFB74D" text-anchor="middle" opacity="0.6" letter-spacing="2">TAIL</text>
</svg>
